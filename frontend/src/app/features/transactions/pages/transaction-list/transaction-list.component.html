<div class="transaction-list-container">
  <h2>Transaction History</h2>

  <div class="loading" *ngIf="loading">
    <p>Loading transactions...</p>
  </div>

  <div class="error" *ngIf="error">
    <p>{{ error }}</p>
    <button (click)="loadTransactions()" class="retry-button">Retry</button>
  </div>

  <div class="transaction-timeline" *ngIf="transactionData$ | async as data">
    <div class="day-group" *ngFor="let day of data.days">
      <div class="day-header">
        <h3>{{ transactionService.formatDate(day.id) }}</h3>
        <span class="transaction-count"
          >{{ day.transactions.length }} transaction{{
            day.transactions.length !== 1 ? "s" : ""
          }}</span
        >
      </div>
      <div class="day-transactions">
        <app-transaction-card
          *ngFor="
            let transaction of day.transactions;
            trackBy: trackByTransactionId
          "
          [transaction]="transaction"
        >
        </app-transaction-card>
      </div>
    </div>
  </div>

  <div
    class="empty-state"
    *ngIf="(transactionData$ | async)?.days.length === 0"
  >
    <p>No transactions found.</p>
  </div>
</div>
